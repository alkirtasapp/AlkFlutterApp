// Top-level build file for the new Flutter/Gradle plugin DSL.
// No 'buildscript { ... }' here; versions are declared in settings.gradle.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    // (Optional but harmless) Ensure :app is evaluated first in some Gradle setups
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
