workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.9
      xcode: 26.4.1
      groups:
        - ios_signing
    scripts:
      - name: Set up code signing
        script: |
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P $CM_CERTIFICATE_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/3f99dff2-5caf-44f8-86c5-6141db018989.mobileprovision
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: cd ios && pod install --repo-update
      - name: Build and Archive IPA
        script: |
          # Version comes from pubspec.yaml (version: NAME+NUMBER)
          flutter build ios --release
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>86HC6YDXYL</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.alkirtas.alkirtas</key>
              <string>AlkirtasAppStore</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release archive -archivePath /tmp/Runner.xcarchive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="AlkirtasAppStore" DEVELOPMENT_TEAM=86HC6YDXYL OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" -allowProvisioningUpdates PODS_CODE_SIGN_STYLE=Automatic
          xcodebuild -exportArchive -archivePath /tmp/Runner.xcarchive -exportOptionsPlist /tmp/ExportOptions.plist -exportPath build/ios/ipa -allowProvisioningUpdates
      - name: Upload to TestFlight
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo $APP_STORE_CONNECT_PRIVATE_KEY | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_PRRR468QZB.p8
          # Xcode 26's altool can't resolve the app from the bundle ID alone
          # ("Cannot determine the Apple ID from Bundle ID"), so pass it explicitly.
          # Version read from pubspec.yaml ("version: 1.1.5+31"), same as the build step.
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=${VERSION_LINE%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "Uploading $BUILD_NAME ($BUILD_NUMBER)"
          xcrun altool --upload-package build/ios/ipa/*.ipa --type ios \
            --apple-id 6762003420 \
            --bundle-id com.alkirtas.alkirtas \
            --bundle-version "$BUILD_NUMBER" \
            --bundle-short-version-string "$BUILD_NAME" \
            --apiKey PRRR468QZB --apiIssuer 00e4e96f-1999-46c8-9344-4c7ee3518aa0
    artifacts:
      - build/ios/ipa/*.ipa

  # ── Shorebird ───────────────────────────────────────────────────────────
  # Needs the Codemagic secret group "shorebird" with SHOREBIRD_TOKEN (an API
  # key from console.shorebird.dev). Releases and patches use Shorebird's
  # Flutter 3.41.9 so patches match the release.
  #
  # ios-shorebird-release: a store version that can later receive patches
  #   (replaces ios-testflight for new versions; same signing and upload).
  # ios-shorebird-patch: sends the Dart changes of the current commit to the
  #   phones that have the release with the SAME version as pubspec.yaml.
  #   No App Store review. Native changes (plugins, ios/ folder) are refused.

  ios-shorebird-release:
    name: iOS Shorebird release (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.9
      xcode: 26.4.1
      groups:
        - ios_signing
        - shorebird
    scripts:
      - &install_shorebird
        name: Install Shorebird
        script: |
          curl -fsSL https://shorebird.dev/install.sh | bash
          echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
      - &ios_signing
        name: Set up code signing
        script: |
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P $CM_CERTIFICATE_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/3f99dff2-5caf-44f8-86c5-6141db018989.mobileprovision
          # Shorebird builds through "flutter build ipa", which signs with the
          # Xcode project settings: point the project at the installed profile.
          xcode-project use-profiles --project ios/Runner.xcodeproj
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>86HC6YDXYL</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.alkirtas.alkirtas</key>
              <string>AlkirtasAppStore</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
      - &pub_and_pods
        name: Flutter dependencies and CocoaPods
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Shorebird release (build, archive, IPA)
        script: |
          shorebird release ios --flutter-version=3.41.9 \
            --export-options-plist=/tmp/ExportOptions.plist
      - name: Upload to TestFlight
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo $APP_STORE_CONNECT_PRIVATE_KEY | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_PRRR468QZB.p8
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=${VERSION_LINE%%+*}
          BUILD_NUMBER=${VERSION_LINE##*+}
          echo "Uploading $BUILD_NAME ($BUILD_NUMBER)"
          xcrun altool --upload-package build/ios/ipa/*.ipa --type ios \
            --apple-id 6762003420 \
            --bundle-id com.alkirtas.alkirtas \
            --bundle-version "$BUILD_NUMBER" \
            --bundle-short-version-string "$BUILD_NAME" \
            --apiKey PRRR468QZB --apiIssuer 00e4e96f-1999-46c8-9344-4c7ee3518aa0
    artifacts:
      - build/ios/ipa/*.ipa

  ios-shorebird-patch:
    name: iOS Shorebird patch (no App Store review)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.9
      xcode: 26.4.1
      groups:
        - ios_signing
        - shorebird
    scripts:
      - *install_shorebird
      - *ios_signing
      - *pub_and_pods
      - name: Shorebird patch
        script: |
          # Patches the release whose version is in pubspec.yaml (do NOT bump
          # the version for a patch).
          RELEASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "Patching release $RELEASE_VERSION"
          shorebird patch ios --release-version="$RELEASE_VERSION" --track=stable \
            --export-options-plist=/tmp/ExportOptions.plist
