name: alkirtas
description: "A new Flutter project."
version: 1.0.7+10

environment:
  sdk: ^3.6.0

# Project dependencies required for functionality
dependencies:
  flutter:
    sdk: flutter
  iconsax: ^0.0.8 # Icons library for UI design
  cupertino_icons: ^1.0.8 # iOS-style icons
  #Utility Packages
  
  http: ^0.13.3 # HTTP client for API calls
  bcrypt: 1.1.3 # Library for password encryption
  flutter_native_splash: ^2.4.4 # Splash screen customization
  get: ^4.6.6 # State management solution
  smooth_page_indicator: ^1.2.0+3
  get_storage: ^2.1.1
  intl: ^0.19.0
  logger: ^2.5.0
  url_launcher: ^6.3.1
  carousel_slider: ^5.0.0
  
  shared_preferences: ^2.0.0
  readmore: ^3.0.0


  #hive for cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  #provider for pagination
  provider: ^6.0.5  

  webview_flutter: ^4.10.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1 

  # Add these Firebase dependencies
 # firebase_core: ^2.27.1
 # cloud_firestore: ^4.15.9
 # firebase_analytics: ^10.8.10
 # firebase_messaging: ^14.7.10
  flutter_local_notifications: ^18.0.1
  mobile_scanner: ^6.0.2
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  uuid: ^4.5.1  # For generating unique session IDs

  # Audio Player for audiobooks
  just_audio: ^0.9.42  # Powerful audio player
  audio_video_progress_bar: ^2.0.3  # Progress bar for audio

  # Environment variables
  flutter_dotenv: ^5.1.0

  # In-app updates from Google Play
  in_app_update: ^4.2.3

  # Secure storage for device UUID (persists across iOS reinstalls via Keychain)
  flutter_secure_storage: ^9.2.2

# Development-only dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter # Tools for testing Flutter applications
  flutter_lints: ^5.0.0 # Code linting for better coding practices
  hive_generator: ^2.0.1
  build_runner: ^2.1.7
  flutter_launcher_icons: ^0.14.3

# Flutter-specific settings
flutter:
  uses-material-design: true # Includes default Material Design icons
  
  # Asset directories for project resources
  assets:
    - .env
    - lib/assets/
    - lib/assets/images/on_boarding_images/
    - lib/assets/icons/
    - lib/assets/logos/
    - lib/assets/logos/logo_light.png
    - lib/assets/images/banners/
    - lib/assets/audio/
    - shorebird.yaml




  # Font configurations
  # TitilliumWeb is used for Latin scripts (French/English).
  # Cairo is registered as the fallback so Arabic glyphs (not present
  # in TitilliumWeb) render in Cairo automatically.
  fonts:
    - family: TitilliumWeb
      fonts:
        - asset: lib/assets/fonts/TitilliumWeb-Light.ttf
          weight: 300
        - asset: lib/assets/fonts/TitilliumWeb-LightItalic.ttf
          weight: 300
          style: italic
        - asset: lib/assets/fonts/TitilliumWeb-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/TitilliumWeb-Italic.ttf
          weight: 400
          style: italic
        - asset: lib/assets/fonts/TitilliumWeb-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/TitilliumWeb-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: lib/assets/fonts/TitilliumWeb-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/TitilliumWeb-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: lib/assets/fonts/TitilliumWeb-Black.ttf
          weight: 900

    - family: Cairo
      fonts:
        - asset: lib/assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: lib/assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: lib/assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: lib/assets/fonts/Cairo-Black.ttf
          weight: 900
flutter_launcher_icons:
  android: "launcher_icon"
  ios: "AppIcon"
  image_path: "lib/assets/icons/icon.png"
  min_sdk_android: 21 
  remove_alpha_ios: true

