name: alkirtas
description: "A new Flutter project."
version: 1.0.0+1
environment:
  sdk: ^3.6.0

# Project dependencies required for functionality
dependencies:
  flutter:
    sdk: flutter
  iconsax: ^0.0.8 # Icons library for UI design
  cupertino_icons: ^1.0.8 # iOS-style icons
  #Utility Packages
  
  http: ^0.13.3 # HTTP client for API calls
  bcrypt: 1.1.3 # Library for password encryption
  flutter_native_splash: ^2.4.4 # Splash screen customization
  get: ^4.6.6 # State management solution
  smooth_page_indicator: ^1.2.0+3
  get_storage: ^2.1.1
  intl: ^0.19.0
  logger: ^2.5.0
  url_launcher: ^6.3.1
  carousel_slider: ^5.0.0
  
  shared_preferences: ^2.0.0
  readmore: ^3.0.0


  #hive for cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  #provider for pagination
  provider: ^6.0.5  



# Development-only dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter # Tools for testing Flutter applications
  flutter_lints: ^5.0.0 # Code linting for better coding practices
  hive_generator: ^2.0.1
  build_runner: ^2.1.7
  flutter_launcher_icons: ^0.14.3

# Flutter-specific settings
flutter:
  uses-material-design: true # Includes default Material Design icons
  
  # Asset directories for project resources
  assets:
    - lib/assets/
    - lib/assets/images/on_boarding_images/
    - lib/assets/icons/
    - lib/assets/logos/
    - lib/assets/logos/logo_light.png
    - lib/assets/images/banners/




  # Font configurations for the Poppins font family
  fonts:
    - family: Poppins
      fonts:
        - asset: lib/assets/fonts/Poppins-Bold.ttf
          weight: 800
        - asset: lib/assets/fonts/Poppins-Italic.ttf
          weight: 300
        - asset: lib/assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: lib/assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
        - asset: lib/assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    
    - family: Cairo
      fonts:
        - asset: lib/assets/fonts/Cairo-Regular.ttf
        - asset: lib/assets/fonts/Cairo-Bold.ttf
flutter_launcher_icons:
  android: "launcher_icon"
  ios: "AppIcon"
  image_path: "lib/assets/icons/icon.png"
  min_sdk_android: 21 
  remove_alpha_ios: true  

