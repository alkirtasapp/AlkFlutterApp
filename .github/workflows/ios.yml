name: iOS Build

on:
  push:
    branches: [cypher, main, master]
  pull_request:
    branches: [cypher, main, master]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    runs-on: macos-14  # macOS Sonoma with Apple Silicon

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS App
        run: flutter build ios --no-codesign --debug

      - name: Find and list built app
        run: |
          echo "Looking for .app files..."
          find build -name "*.app" -type d 2>/dev/null || true
          ls -la build/ios/iphoneos/ 2>/dev/null || true

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app
          retention-days: 7
